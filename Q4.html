<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MelodyV Online</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #efefef;
      color: #222;
      line-height: 1.5;
    }

    .container {
      width: 1100px;
      max-width: 95%;
      margin: 20px auto;
      background: #fff;
      border: 1px solid #d9d9d9;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
    }

    .topbar {
      background: #1f1f1f;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      font-size: 12px;
    }

    .topbar .social {
      letter-spacing: 2px;
    }

    .main {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      padding: 18px 20px 22px;
    }

    .card {
      background: #f7f7f7;
      border: 1px solid #e4e4e4;
      border-radius: 10px;
      padding: 18px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
    }

    .course-box {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .course-box img {
      width: 200px;
      height: 230px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .course-info h2 {
      color: #1e3a5f;
      font-size: 2.1rem;
      margin-bottom: 8px;
    }

    .course-info p {
      color: #555;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      background: #1d4e89;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn.secondary {
      background: #dfe9f4;
      color: #213a57;
    }

    .lesson-box {
      background: #fff;
      border: 1px solid #dfe7f1;
      border-radius: 10px;
      padding: 20px 18px;
    }

    .lesson-box h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #1e3a5f;
    }

    .lesson-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .lesson-list li {
      padding: 10px 0;
      border-bottom: 1px dashed #d9dfe7;
      color: #374151;
      font-size: 0.96rem;
    }

    .lesson-list li:last-child {
      border-bottom: none;
    }

    .meta {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .meta .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      background: #eef5ff;
      color: #1e3a5f;
      padding: 6px 10px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .footer-line {
      padding: 14px 20px 18px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      color: #666;
      font-size: 0.9rem;
    }

    @media (max-width: 760px) {
      .main {
        grid-template-columns: 1fr;
      }

      .course-box {
        flex-direction: column;
        text-align: center;
      }

      .course-box img {
        width: 100%;
        max-width: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>Chào mừng bạn đến với MelodyV Online</div>
      <div class="social">◉ ◌ ◍</div>
    </div>

    <main class="main">
      <section class="card">
        <div class="course-box">
          <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=900&q=80" alt="Guitar lesson" />

          <div class="course-info">
            <h2>MelodyV Online</h2>
            <p>Học nhạc mọi lúc mọi nơi</p>

            <div class="btn-row">
              <button class="btn">Bài học: Học âm cơ bản Guitar</button>
              <button class="btn secondary">Lịch học</button>
            </div>

            <div class="meta">
              <div class="tags">
                <span class="tag">Guitar</span>
                <span class="tag">Nhạc lý</span>
                <span class="tag">Khóa học</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="lesson-box">
        <h3>Học guitar</h3>
        <ul class="lesson-list">
          <li>Giai điệu cơ bản</li>
          <li>Hợp âm cơ bản</li>
          <li>Khung nhịp</li>
          <li>Nhạc lý âm nhạc</li>
        </ul>
      </aside>
    </main>

    <div class="footer-line">
      Trung tâm âm nhạc MelodyV Online - Địa chỉ: Hà Nội - Hotline: 0900 123 456
    </div>
  </div>
</body>
</html>
