<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký khóa học</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e9edf4;
      color: #1f2937;
      line-height: 1.5;
    }

    .page {
      width: 1000px;
      max-width: 96%;
      margin: 24px auto;
      background: #fff;
      border: 1px solid #d8e0ea;
      box-shadow: 0 0 12px rgba(0,0,0,0.08);
      border-radius: 8px;
      overflow: hidden;
    }

    .topbar {
      background: #1c1c1c;
      color: #fff;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
    }

    .topbar .icons {
      letter-spacing: 2px;
    }

    .panel {
      padding: 18px 22px 10px;
    }

    .title {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 700;
      color: #2d3d52;
      margin-bottom: 16px;
    }

    .form-wrap {
      border: 1px solid #dbe4ef;
      border-radius: 8px;
      background: #f6f9fc;
      padding: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.92rem;
    }

    .field label {
      color: #2f3b4a;
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #cfd9e3;
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 0.95rem;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .inline {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding-top: 8px;
    }

    .inline input[type="radio"] {
      width: auto;
      margin: 0;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.primary {
      background: #1d4e89;
      color: #fff;
    }

    .btn.secondary {
      background: #f1f5f9;
      color: #1f2937;
      border: 1px solid #d9e2ec;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>Đăng ký thành viên</div>
      <div class="icons">◉ ◌ ◍</div>
    </div>

    <div class="panel">
      <div class="title">Đăng ký tài khoản mới</div>

      <div class="form-wrap">
        <form action="#" method="post">
          <div class="form-grid">
            <div class="field">
              <label>Họ và tên</label>
              <input type="text" name="hoten" placeholder="Nhập họ tên" />
            </div>

            <div class="field">
              <label>Ngày sinh</label>
              <input type="date" name="ngaysinh" />
            </div>

            <div class="field">
              <label>Giới tính</label>
              <div class="inline">
                <label><input type="radio" name="gioitinh" value="Nam" checked /> Nam</label>
                <label><input type="radio" name="gioitinh" value="Nữ" /> Nữ</label>
              </div>
            </div>

            <div class="field">
              <label>Số điện thoại</label>
              <input type="tel" name="sdt" placeholder="0987 654 321" />
            </div>

            <div class="field">
              <label>Email</label>
              <input type="email" name="email" placeholder="example@gmail.com" />
            </div>

            <div class="field">
              <label>Địa chỉ</label>
              <input type="text" name="diachi" placeholder="Nhập địa chỉ" />
            </div>

            <div class="field">
              <label>Tỉnh thành</label>
              <select name="tinhthanh">
                <option value="">-- Chọn tỉnh --</option>
                <option>Hà Nội</option>
                <option>Đà Nẵng</option>
                <option>Hồ Chí Minh</option>
              </select>
            </div>

            <div class="field">
              <label>Khóa học</label>
              <select name="khoahoc">
                <option value="">-- Chọn khóa học --</option>
                <option>HTML/CSS</option>
                <option>JavaScript</option>
                <option>PHP</option>
              </select>
            </div>

            <div class="field" style="grid-column: 1 / -1;">
              <label>Ghi chú</label>
              <textarea name="ghichu" placeholder="Viết ghi chú ..."></textarea>
            </div>
          </div>

          <div class="actions">
            <button type="submit" class="btn primary">Đăng ký</button>
            <button type="reset" class="btn secondary">Nhập lại</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
